# Weighted clinical order profiles.
#
# Profiles reference CONCEPTS, never codes (decision F3) — each template offers a
# different concrete checkbox for the same clinical intent, so a concept resolves
# against whatever that template actually prints. A concept that resolves to
# nothing is skipped and recorded as unfulfilled.
#
# Noise on top of every profile: each item is dropped with `drop_rate`, and an
# unrelated item is added with `add_rate`, so the eval sees imperfect real-world
# patterns rather than textbook ones.
version: 1

noise:
  drop_rate: 0.10
  add_rate: 0.08

profiles:
  - id: preoperative_clearance
    weight: 12
    concepts: [cbc, prothrombin, ptt, bun, creatinine, electrolytes_na_k, urinalysis,
               chest_xray, ecg]

  - id: thyroid_workup
    weight: 8
    concepts: [tsh, free_t3, free_t4, thyroid_us]

  - id: diabetes_monitoring
    weight: 12
    concepts: [fbs, hba1c, lipid_profile, creatinine, urinalysis]

  - id: annual_physical
    weight: 14
    concepts: [cbc, urinalysis, fecalysis, chest_xray, fbs, lipid_profile]

  - id: liver_evaluation
    weight: 8
    concepts: [liver_enzymes, bilirubins, alk_phos, hbsag, hbt_us]

  - id: breast_mass_workup
    weight: 5
    concepts: [breast_us, mammogram, cbc]
    constraints: {sex: F}

  - id: cardiac_chest_pain
    weight: 7
    # chest_ct rules out PE and dissection, and it is the only line that carries
    # contrast modifiers — see the note on serum_calcium below.
    concepts: [troponin, cpk, ldh, ecg, echo_2d, chest_xray, chest_ct]

  - id: prenatal
    weight: 8
    concepts: [cbc, blood_typing, urinalysis, hbsag, vdrl, ogtt, pregnancy_test]
    constraints: {sex: F}

  # Three concepts were added to existing profiles rather than as new profiles,
  # so the profile distribution is unchanged. Each is standard practice —
  # pregnancy test in a prenatal panel, calcium in a renal panel, chest CT in a
  # chest-pain workup — and each reaches a line that renders a circled
  # sub-option or a contrast modifier. Nothing else in the dataset could reach
  # them, so those ground-truth fields were empty on every sample.
  - id: renal_panel
    weight: 6
    concepts: [bun, creatinine, uric_acid, electrolytes_na_k, urinalysis, serum_calcium]

  - id: hepatitis_screen
    weight: 5
    concepts: [hbsag, vdrl, liver_enzymes]

  - id: sparse
    weight: 8
    concepts: [urinalysis, cbc]
    max_items: 2

  - id: broad
    weight: 4
    concepts: [cbc, urinalysis, fecalysis, fbs, hba1c, lipid_profile, bun, creatinine,
               uric_acid, electrolytes_na_k, liver_enzymes, bilirubins, alk_phos,
               tsh, free_t4, chest_xray, ecg, hbsag, vdrl]

# Stress profiles force the co-occurrences the taxonomy flagged as dangerous.
# Random sampling would produce one or two of each at this dataset size; these
# make sure every collision is actually exercised.
stress_profiles:
  - id: stress_bundle_and_components
    codes: [LIPID_PROFILE, CHOL_TOTAL, TRIGLYCERIDES, HDL, LDL, VLDL]
  - id: stress_ldl_ldh
    codes: [LDL, LDH, HDL, CPK_TOTAL]
  - id: stress_pt_ptt
    codes: [PT_PROTHROMBIN, PTT, BLEEDING_TIME, CLOTTING_TIME]
  - id: stress_hepatitis_family
    codes: [HBSAG_SCREENING, HBSAG_TITER, ANTI_HBS, ANTI_HBC, ANTI_HBE]
  - id: stress_thyroid_panel_and_us
    codes: [T3, T4, FT3, FT4, TSH, US_THYROID]
  - id: stress_kub_both_sections
    codes: [US_KUB, XR_KUB]
  - id: stress_electrolytes_bundle_and_parts
    codes: [ELECTROLYTES, NA, K, CL]
  - id: stress_cbc_both
    codes: [CBC, CBC_PLT, PLATELET_COUNT]
