# =============================================================================
# CONCEPTS  (approved F3)
#
# Order profiles reference CONCEPTS, not codes, because each template offers a
# different concrete checkbox for the same clinical intent. At fill time a
# concept resolves against the template's offered item set.
#
#   mode: first_available            take the first offered code in `prefer`
#         first_available_else_expand  prefer the bundle; if the template does
#                                      not offer it, take every offered code in
#                                      `expand`
# A concept that resolves to nothing is skipped (recorded in ground truth as an
# unfulfilled concept, so profile coverage stays auditable).
# =============================================================================
concepts:
  cbc:             {display: "Complete Blood Count", mode: first_available, prefer: [CBC_PLT, CBC]}
  platelet:        {display: "Platelet Count", mode: first_available, prefer: [CBC_PLT, PLATELET_COUNT]}
  urinalysis:      {display: "Urinalysis", mode: first_available, prefer: [URINALYSIS]}
  fecalysis:       {display: "Fecalysis", mode: first_available, prefer: [FECALYSIS]}
  blood_typing:    {display: "Blood Typing", mode: first_available, prefer: [BLOOD_TYPING_RH]}
  pregnancy_test:  {display: "Pregnancy Test", mode: first_available, prefer: [PREGNANCY_TEST]}

  lipid_profile:
    display: "Lipid Profile"
    mode: first_available_else_expand
    prefer: [LIPID_PROFILE]
    expand: [CHOL_TOTAL, TRIGLYCERIDES, HDL, LDL, VLDL]

  electrolytes_na_k:
    display: "Sodium / Potassium"
    mode: first_available_else_expand
    prefer: [ELECTROLYTES]
    expand: [NA, K]

  liver_enzymes:
    display: "AST / ALT"
    mode: first_available_else_expand
    prefer: [LIVER_PROFILE]
    expand: [SGOT_AST, SGPT_ALT]

  # Calcium and chest CT are the two orderable lines that carry a circled
  # sub-option and a tick-box modifier respectively. Without a concept naming
  # them no profile can reach them, so `expected.variants` and
  # `expected.modifiers` were empty across the whole dataset and the harness's
  # variant and modifier accuracy had no denominator.
  serum_calcium:
    display: "Serum Calcium"
    mode: first_available_else_expand
    prefer: [CA_SERUM]
    expand: [CA_TOTAL, CA_IONIZED]      # tpl_03 prints the two component lines

  chest_ct:        {display: "Chest CT", mode: first_available, prefer: [CT_CHEST]}

  bilirubins:      {display: "Bilirubins", mode: first_available, prefer: [BILI_PANEL]}
  alk_phos:        {display: "Alkaline Phosphatase", mode: first_available, prefer: [ALP]}
  bun:             {display: "BUN", mode: first_available, prefer: [BUN]}
  creatinine:      {display: "Creatinine", mode: first_available, prefer: [CREATININE]}
  uric_acid:       {display: "Uric Acid", mode: first_available, prefer: [URIC_ACID]}
  fbs:             {display: "Fasting Blood Sugar", mode: first_available, prefer: [FBS]}
  hba1c:           {display: "HbA1c", mode: first_available, prefer: [HBA1C]}
  ogtt:            {display: "OGTT", mode: first_available, prefer: [OGTT, OGTT_75G, OGTT_100G]}
  prothrombin:     {display: "Prothrombin Time", mode: first_available, prefer: [PT_PROTHROMBIN]}
  ptt:             {display: "PTT", mode: first_available, prefer: [PTT]}
  tsh:             {display: "TSH", mode: first_available, prefer: [TSH]}
  free_t3:         {display: "FT3", mode: first_available, prefer: [FT3]}
  free_t4:         {display: "FT4", mode: first_available, prefer: [FT4]}
  hbsag:           {display: "HBsAg", mode: first_available, prefer: [HBSAG_SCREENING, HBSAG_TITER]}
  vdrl:            {display: "VDRL/RPR", mode: first_available, prefer: [VDRL_RPR]}
  troponin:        {display: "Troponin", mode: first_available, prefer: [TROPONIN_I, TROPONIN_T]}
  cpk:             {display: "Total CPK", mode: first_available, prefer: [CPK_TOTAL]}
  ldh:             {display: "LDH", mode: first_available, prefer: [LDH]}

  chest_xray:      {display: "Chest X-ray", mode: first_available, prefer: [XR_CHEST_PA_L, XR_CHEST_AP_L]}
  ecg:             {display: "12-lead ECG", mode: first_available, prefer: [ECG_12L]}
  echo_2d:         {display: "2D Echocardiogram", mode: first_available, prefer: [ECHO_2D]}
  thyroid_us:      {display: "Thyroid Ultrasound", mode: first_available, prefer: [US_THYROID]}
  breast_us:       {display: "Breast Ultrasound", mode: first_available, prefer: [US_BREAST]}
  mammogram:       {display: "Mammogram", mode: first_available, prefer: [MAMMOGRAM]}
  hbt_us:          {display: "HBT Ultrasound", mode: first_available, prefer: [US_HBT]}
