# =============================================================================
# Canonical test taxonomy — the contract between the CV model and downstream
# consumers.
#
# SCOPE: this file names tests. It contains NO price, currency, or amount data
# of any kind, by design. Pricing is a separate facility-specific layer that
# keys against `code`, `composite_of`, and `supersedes`. Do not add money here.
#
# Two distinct string sets per test:
#   surface_forms — strings the generator is ALLOWED TO PRINT on a form.
#   aliases       — strings the resolver MUST ACCEPT when parsing a form.
# aliases ⊇ surface_forms in meaning, but are listed separately: a label printed
# from `aliases` is flagged `resolution: alias` in ground truth so the resolver's
# alias path is exercised by the dataset itself.
# =============================================================================
version: 2

# -----------------------------------------------------------------------------
# Sections a template may declare. `scope_hint` on a template section refers to
# these ids, and scoped aliases resolve against them.
# -----------------------------------------------------------------------------
sections:
  - {id: hematology,          display_names: ["Laboratory Test", "Hematology", "Clinical Microscopy"]}
  - {id: blood_chemistry,     display_names: ["Blood Chemistry", "Chemistry"]}
  - {id: renal,               display_names: ["Renal Function", "Kidney Function"]}
  - {id: metabolism,          display_names: ["Metabolism", "Glucose Studies"]}
  - {id: liver,               display_names: ["Liver Profile", "Liver Function"]}
  - {id: thyroid,             display_names: ["Thyroid Function", "Thyroid"]}
  - {id: cardiac,             display_names: ["Cardiac Function", "Cardiac Markers"]}
  - {id: bleeding,            display_names: ["Bleeding Parameters", "Coagulation"]}
  - {id: serology,            display_names: ["Serology"]}
  - {id: hepatitis,           display_names: ["Hepatitis Markers", "Hepatitis Profile"]}
  - {id: xray,                display_names: ["X-Ray", "Radiology", "X-RAY"]}
  - {id: ultrasound,          display_names: ["Ultrasound", "ULTRASOUND", "Ultrasonography"]}
  - {id: ct_advanced,         display_names: ["CT Scan", "Advanced Imaging", "CT / Special"]}
  - {id: cardiac_diagnostics, display_names: ["Cardiac Diagnostics", "Cardio"]}

categories:
  [hematology, chemistry, metabolism, liver, thyroid, cardiac, coagulation,
   serology, hepatitis, radiology, ultrasound, advanced_imaging, cardiac_diagnostics]

# -----------------------------------------------------------------------------
# Strings that must NEVER resolve without section context. The resolver returns
# UNRESOLVED_AMBIGUOUS and records the candidate list.
# `validate.py` cross-checks this against collisions it derives from the test
# table itself — a collision present in the data but absent here is an error,
# and an entry here with no real collision is also an error.
# -----------------------------------------------------------------------------
blocked_global_aliases:
  "PT":             [PT_PROTHROMBIN, PREGNANCY_TEST]
  "CT":             [CLOTTING_TIME, CT_WHOLE_ABDOMEN, CT_UPPER_ABDOMEN, CT_CHEST]
  "BT":             [BLEEDING_TIME, BLOOD_TYPING_RH]
  "TB":             [BILI_TOTAL]
  "DB":             [BILI_DIRECT]
  "IB":             [BILI_INDIRECT]
  "B1":             [BILI_DIRECT]
  "B2":             [BILI_INDIRECT]
  "TBil":           [BILI_TOTAL]
  "Thyroid":        [US_THYROID]
  "Liver Profile":  [LIVER_PROFILE]
  "HBsAg":          [HBSAG_SCREENING, HBSAG_TITER]
  "KUB":            [US_KUB, XR_KUB]
  "Breast":         [US_BREAST, MAMMOGRAM]
  "Whole Abdomen":  [US_WHOLE_ABDOMEN, CT_WHOLE_ABDOMEN]
  "Upper Abdomen":  [US_UPPER_ABDOMEN, CT_UPPER_ABDOMEN]
  "Chest":          [XR_CHEST_PA_L, XR_CHEST_AP_L, CT_CHEST]

# -----------------------------------------------------------------------------
# Resolver policy.
# -----------------------------------------------------------------------------
matching:
  normalize: casefold_strip_punct    # lowercase, punctuation runs -> single space
  substring_matching: false          # REQUIRED: LDL ⊂ VLDL, PT ⊂ PTT, T3 ⊂ FT3
  fuzzy:
    enabled: true
    max_edit_distance: 1
    # Fuzzy matching is DISABLED OUTRIGHT for every code listed here. Within
    # these families a 1-character edit is a different test, so only an exact
    # (normalized) match may resolve them.
    excluded_families:
      - [LDL, LDH]
      - [SGOT_AST, SGPT_ALT]
      - [BUN, URIC_ACID]                 # "BUN" vs "BUA", adjacent on renal blocks
      - [OGCT_50G, OGTT_75G, OGTT_100G]
      - [T3, T4, FT3, FT4]
      - [HBSAG_SCREENING, HBSAG_TITER, ANTI_HBS, ANTI_HBC, ANTI_HBE]
      - [PT_PROTHROMBIN, PTT]
      - [ECG_12L, ECHO_2D]
      - [TROPONIN_I, TROPONIN_T]
      - [CBC, CBC_PLT]
      - [US_UPPER_ABDOMEN, US_LOWER_ABDOMEN, US_WHOLE_ABDOMEN]

# =============================================================================
# TESTS
#
# Field reference:
#   composition   atomic | bundle | component      (structural, not financial)
#   composite_of  codes this bundle subsumes
#   component_of  bundles that subsume this code
#   supersedes    if this code and the listed codes both appear, this one is the
#                 operative order. Downstream consumers key against it; this repo
#                 attaches no arithmetic to it.
#   scoped_only   the primary surface form is ambiguous; requires a section scope
#   blocked       strings that must never resolve to this code without scope
#   constraints   clinical validity gates used by Stage 2 coherence checks
#   variants      one printed checkbox, several distinct orderable results
#   modifiers     options that qualify the order (e.g. contrast)
# =============================================================================
tests:

